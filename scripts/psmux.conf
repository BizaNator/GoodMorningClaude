# BrainMon psmux configuration
# Deployed by setup-host.sh
# Requires psmux >= 3.1.0

# ═══════════════════════════════════════════════════════════════
# MOUSE SUPPORT
# ═══════════════════════════════════════════════════════════════
set -g mouse on

# ═══════════════════════════════════════════════════════════════
# STATUS BAR
# ═══════════════════════════════════════════════════════════════
set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-bg colour24
set -g status-fg colour255

set -g status-left-length 40
set -g status-left "#[fg=colour255,bg=colour99,bold] #S #[default] "

set -g status-right-length 60
set -g status-right "#[fg=colour255,bg=colour24] %Y-%m-%d %H:%M "

set -g status-justify centre
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour255,bg=colour99,bold] #I:#W #[default]"

# ═══════════════════════════════════════════════════════════════
# PANE BORDERS
# ═══════════════════════════════════════════════════════════════
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour99

# ═══════════════════════════════════════════════════════════════
# WINDOW NAMING
# ═══════════════════════════════════════════════════════════════
set -g automatic-rename on
set -g renumber-windows on

# ═══════════════════════════════════════════════════════════════
# HISTORY & SCROLLBACK
# ═══════════════════════════════════════════════════════════════
set -g history-limit 50000

# ═══════════════════════════════════════════════════════════════
# KEY BINDINGS
# ═══════════════════════════════════════════════════════════════
set -g prefix C-b

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+Arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+Arrow
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

# Reload config
bind r source-file ~/.psmux.conf

# ═══════════════════════════════════════════════════════════════
# DISPLAY & PERFORMANCE
# ═══════════════════════════════════════════════════════════════
set -g display-panes-time 4000
set -g monitor-activity on
set -g visual-activity off
set -g base-index 1
set -g pane-base-index 1
set -s escape-time 0
set -g focus-events on
set -g display-time 2000
set -g prediction-dimming off
set -g allow-passthrough on
set -g default-shell cmd

# ═══════════════════════════════════════════════════════════════
# CURSOR (psmux v3.x)
# ═══════════════════════════════════════════════════════════════
set -g cursor-style bar
set -g cursor-blink on

# ═══════════════════════════════════════════════════════════════
# CLAUDE CODE INTEGRATION (psmux v3.x)
# ═══════════════════════════════════════════════════════════════
# Fix TTY detection for Claude Code running in psmux panes
set -g claude-code-fix-tty on
# Force interactive mode so agent teams spawn visible panes
set -g claude-code-force-interactive on

# ═══════════════════════════════════════════════════════════════
# COPY MODE (Vim-style)
# ═══════════════════════════════════════════════════════════════
setw -g mode-keys vi

bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
